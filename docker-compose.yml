# Pod Beta application services.
#
# B10: this file used to define its own PostgreSQL, Redis, KRaft Kafka and
# kafka-ui -- a second copy of the infrastructure stack, at the same host ports
# as the workspace-root one. That is the "no single shared bus" problem
# B10 describes, reintroduced inside the pod: two stacks that both claim 9092,
# neither of which is the plan's declared single bus.
#
# The infrastructure now has exactly one definition, at the workspace root:
#
#   docker compose -f ../docker-compose.yml up -d
#   docker compose up -d
#
# This file contains only Beta's three application services. They join the
# root stack's network and address the broker by service name.
#
# The documented run mode is still hybrid -- `port-registery.md` records
# "infra in Docker Compose, services via uvicorn on the host" -- so bringing
# these app services up is optional. The Dockerfiles exist because N-B2
# recorded that the pod had no deployable packaging at all, not because the
# hybrid run needs them.

services:
  validation-engine:
    build:
      context: .
      dockerfile: services/validation_engine/Dockerfile
    image: m2/validation-engine
    container_name: m2_beta_validation_engine
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      VE_PORT: 8002
      # Injected, not defaulted: the broker is the root stack's.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # B1: the evidence consumer is opt-in. It is off here so a `compose up`
      # does not start a consumer loop against a bus that may have no
      # producer yet; set to "true" to consume live evidence.
      KAFKA_EVIDENCE_ENABLED: "${KAFKA_EVIDENCE_ENABLED:-false}"
      M2_TOPICS_PATH: /workspace/topics.yaml
      # B8: Alpha's rule endpoint. Injected rather than defaulted so the
      # Alpha host is a deployment decision, not a source edit.
      ALPHA_RULES_URL: "${ALPHA_RULES_URL:-http://127.0.0.1:8001/api/v2/rules}"
    volumes:
      - ../topics.yaml:/workspace/topics.yaml:ro
    networks:
      - m2

  outcome-classifier:
    build:
      context: .
      dockerfile: services/outcome_classifier/Dockerfile
    image: m2/outcome-classifier
    container_name: m2_beta_outcome_classifier
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      OC_PORT: 8003
    networks:
      - m2

  verdict-publisher:
    build:
      context: .
      dockerfile: services/verdict_publisher/Dockerfile
    image: m2/verdict-publisher
    container_name: m2_beta_verdict_publisher
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      VP_PORT: 8004
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      M2_TOPICS_PATH: /workspace/topics.yaml
    volumes:
      - ../topics.yaml:/workspace/topics.yaml:ro
    depends_on:
      - validation-engine
      - outcome-classifier
    networks:
      - m2

networks:
  # The root stack's network, named explicitly rather than with
  # `external: true` so `docker compose up` works whether or not the root stack
  # already created it. The root compose declares this same name.
  m2:
    name: m2_infra
    external: true
